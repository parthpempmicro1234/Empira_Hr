services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./hrms_project
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "local-docker-dev-secret-change-me"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,backend"
      CORS_ALLOWED_ORIGINS: "${FRONTEND_PUBLIC_URL:-http://localhost:5174}"
      FRONTEND_URL: "${FRONTEND_PUBLIC_URL:-http://localhost:5174}"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_CACHE_URL: "redis://redis:6379/1"
      CHANNEL_REDIS_URL: "redis://redis:6379/2"
      SQLITE_PATH: "/data/db.sqlite3"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./Empira_HR_UI
      args:
        VITE_API_URL: "${BACKEND_PUBLIC_URL:-http://localhost:8001/}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:8080"

volumes:
  backend-data:
  redis-data:
