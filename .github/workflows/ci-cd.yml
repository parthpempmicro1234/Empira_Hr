name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/empira-hr-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/empira-hr-frontend

jobs:
  backend:
    name: Backend install, lint, and test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: hrms_project
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hrms_project/requirements.deploy.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.deploy.txt

      - name: Lint backend configuration
        run: python manage.py check

      - name: Run backend tests
        run: |
          python manage.py test \
            accounts \
            organization \
            leave \
            documents \
            team \
            notifications.tests.NotificationDispatcherTests \
            notifications.tests.NotificationAPITests \
            notifications.tests.LeaveNotificationServiceTests \
            notifications.tests.FeedNotificationServiceTests \
            --noinput

  frontend:
    name: Frontend install, lint, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Empira_HR_UI
    env:
      VITE_API_URL: http://127.0.0.1:8000/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Empira_HR_UI/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        continue-on-error: true
        run: npm run lint

      - name: Run frontend tests
        run: npm test --if-present

      - name: Build frontend
        run: npx vite build

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate GHCR secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::Missing required secret: GHCR_TOKEN"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: hrms_project
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:main
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: Empira_HR_UI
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || 'http://127.0.0.1:8000/' }}
            VITE_WS_NOTIFICATIONS_URL=${{ secrets.VITE_WS_NOTIFICATIONS_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:main
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
      RENDER_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Render secrets
        run: |
          missing=()
          for name in RENDER_API_KEY RENDER_BACKEND_SERVICE_ID RENDER_FRONTEND_SERVICE_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Trigger backend deploy
        run: .github/scripts/deploy-render.sh backend "$RENDER_BACKEND_SERVICE_ID" "${BACKEND_IMAGE}:main"

      - name: Trigger frontend deploy
        run: .github/scripts/deploy-render.sh frontend "$RENDER_FRONTEND_SERVICE_ID" "${FRONTEND_IMAGE}:main"
